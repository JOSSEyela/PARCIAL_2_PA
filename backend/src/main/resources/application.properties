spring.application.name=acortador
server.port=8080

# Fábrica abstracta a usar: mongo-redis (por defecto) | memory
app.infrastructure=mongo-redis
app.base-url=http://localhost:8080
app.frontend-origin=http://localhost:5173
app.cache.ttl-seconds=30

# MongoDB (Spring Boot 4 usa el prefijo spring.mongodb.*)
spring.mongodb.uri=mongodb://localhost:27017/acortador
spring.data.mongodb.auto-index-creation=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false
